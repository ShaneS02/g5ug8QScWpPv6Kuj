[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Mon_Reader"
version = "0.1.0"
description = "Mon_Reader_Project"
readme = "README.md"
requires-python = "==3.12"

dependencies = [
    "numpy==2.5.1",
    "pandas==3.0.5",
    "ipykernel==7.3.0",
    "scikit-learn==1.9.0",
    "matplotlib==3.11.1",
    "pillow==13.0.0",
    "seaborn==0.13.2",
    "opencv-python==5.0.0.93",
    "tensorflow==2.21.0"

]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]